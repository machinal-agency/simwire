version: 2
updates:
  - package-ecosystem: npm
    directory: /packages/sdk
    schedule:
      interval: weekly
    groups:
      # One pull request for the routine bumps, separate ones for majors.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: gradle
    directory: /apps/android
    schedule:
      interval: monthly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
