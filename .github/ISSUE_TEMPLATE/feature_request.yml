name: Feature request
description: Suggest something simwire should be able to do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation rather than the solution. Knowing the problem often surfaces a simpler answer than the one either of us had in mind.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: How do you handle it today?
      description: Workarounds tell us how much this hurts, and sometimes they are good enough to document instead.

  - type: textarea
    id: idea
    attributes:
      label: What would you like simwire to do?
      description: An API sketch is welcome if you have one in mind.
